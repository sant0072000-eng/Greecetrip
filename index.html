 const blob = new Blob([content], {type});
 const url = URL.createObjectURL(blob);
 const link = document.createElement('a');
 link.href = url;
 link.download = filename;
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(() => URL.revokeObjectURL(url), 1000);
}

 else if(t.id==='eCsv'){try{downloadFile('greece-expenses.csv',csvText(),'text/csv;charset=utf-8');t.textContent='Download started'}catch(x){t.textContent='Download unavailable. Use Copy for Google Sheets'}}
 else if(t.id==='eTsv'){const x=exportRows().map(r=>r.join('\t')).join('\n');try{navigator.clipboard.writeText(x).then(()=>{t.textContent='Copied. Paste into a Google Sheets cell'},()=>{t.textContent='Copy not allowed here'})}catch(e){t.textContent='Copy not allowed here'}}
 else if(t.id==='shr'){const x=dayText(day);try{if(navigator.share){navigator.share({text:x}).catch(()=>{})}else{navigator.clipboard.writeText(x).then(()=>{t.textContent='Copied'},()=>{t.textContent='Not allowed here'})}}catch(e){t.textContent='Not allowed here'}}
 else if(t.id==='eAdd'){const a=parseFloat($('#eA').value),p=$('#eP').value;if(!(a>0)||!p){$('#eErr').textContent='Choose who paid and type an amount.';return}const e={n:$('#eN').value.trim(),a,c:$('#eC').value,d:+$('#eD').value,p,t:Date.now()};
  if(sharedMode){
   if(expenseSaving)return;
   if(!SYNC){$('#eErr').textContent='Shared storage is not connected. Reload the online trip and try again.';return}
   const signature=JSON.stringify(e,(key,value)=>key==='t'?undefined:value);
   if(t.dataset.pendingDraft!==signature){t.dataset.pendingId=crypto.randomUUID();t.dataset.pendingDraft=signature}
   e.id=t.dataset.pendingId;expenseSaving=true;t.disabled=true;
   try{await SYNC.add(e);const details=$('#eN'),amount=$('#eA');if(details)details.value='';if(amount)amount.value='';const button=$('#eAdd');if(button){delete button.dataset.pendingId;delete button.dataset.pendingDraft}if($('#eErr'))$('#eErr').textContent='Saved to shared trip.'}
   catch(error){if($('#eErr'))$('#eErr').textContent=error.message||'Could not save. Check your connection and try again.'}
   finally{expenseSaving=false;if($('#eAdd'))$('#eAdd').disabled=false}
  }else{e.id='l'+Date.now();ex.push(e);S.set('gr_ex',ex);render(1)}}
 else if(t.id==='eCopy'){const q=tally();const txt=`Greece trip expenses\nSanthosh paid ${eur(q.s)}\nJohn paid ${eur(q.j)}\nTotal ${eur(q.t)}, each share ${eur(q.t/2)}\n${q.msg}\n\n`+ex.map(e=>`${D[e.d].d}: ${e.c}${e.n?' ('+e.n+')':''}, ${e.p||'?'}, ${eur(e.a)}`).join('\n');try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='Copied'},()=>{t.textContent='Copy not allowed here'})}catch(x){t.textContent='Copy not allowed here'}}
 else if(t.dataset.x!==undefined){const q=ex[+t.dataset.x];if(sharedMode){if(!SYNC)return;t.disabled=true;try{await SYNC.remove(q.id)}catch(error){SYNC.status(error.message||'Could not delete. Try again.');t.disabled=false}}else{ex.splice(+t.dataset.x,1);S.set('gr_ex',ex);render(1)}}
});
document.addEventListener('change',e=>{
 const i=e.target;
 if(i.id==='eF'){ef=+i.value;render(1);return}
 if(i.dataset.b){const c=bd();c[i.dataset.b]=i.checked;S.set('gr_bd',c)}
 if(i.dataset.k){const c=S.get('gr_ck',{});c[i.dataset.k]=i.checked;S.set('gr_ck',c)}
 if(i.dataset.i){const c=S.get('gr_ik',{});c[i.dataset.i]=i.checked;S.set('gr_ik',c)}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.dataset&&t.dataset.po!==undefined){t.open?PO.add(+t.dataset.po):PO.delete(+t.dataset.po)}},true);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.fx){FX[t.dataset.fx]=t.value;S.set('gr_fx',FX);document.getElementById('fx'+t.dataset.fx).textContent=fxTxt(t.dataset.fx)}if(t.dataset&&t.dataset.n!==undefined)saveNote(+t.dataset.n,t.value)});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='days'||e.target.closest('.chips,input,select,table,textarea'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>90&&Math.abs(dy)<45){day=Math.max(0,Math.min(D.length-1,day+(dx<0?1:-1)));render()}},{passive:true});
render();
document.addEventListener('DOMContentLoaded',()=>{if(window.TripWeather)window.TripWeather.start(()=>({view,day,days:D,places:PL}))});
if(typeof startTripSync==='function')startTripSync();
else document.getElementById('syncStatus').textContent=sharedMode?'Shared storage could not load. Reload this page before adding expenses.':'Offline file: open the shared online trip to sync. Expenses here stay on this device.';
</script></body></html>
